_items\"}, {\"identifier\": \"${var.catalog}.${var.schema}.pos_transactions\"}, {\"identifier\": \"${var.catalog}.${var.schema}.stores\"}]}, \"instructions\": {\"text_instructions\": [{\"id\": \"30000000000000000000000000000001\", \"content\": [\"You answer questions about Little Caesars store operations for 25 Metro Detroit stores (store_id 1-25).\\n- Orders live in pos_transactions (one row per order) and pos_line_items (one row per item). Revenue = SUM(order_total); food sales = SUM(food_subtotal).\\n- channel values: walk_in (Hot-N-Ready counter), pizza_portal (app or online pickup from the heated Pizza Portal), delivery (DoorDash), phone. Say \\\"Pizza Portal\\\" and \\\"Hot-N-Ready walk-in\\\" in answers.\\n- Dayparts by order_hour: lunch = 11-13, afternoon = 14-15, dinner rush = 16-19, late night = 20-22.\\n- Dough: dough_prep_log has one row per store, prep_date, dough_type (Large Classic, Thin Crust, Deep Dish, Crazy Bread). Waste % = SUM(balls_wasted) / SUM(balls_mixed). A stockout day has rush_stockout_flag = true; balls_short is the shortfall.\\n- menu_items.dough_type maps each pizza or bread to the dough it uses (NULL for wings, dips, sauce, drinks).\\n- local_events lists Detroit Tigers, Red Wings, Pistons, and Lions home games. Join on event_date = order_date or prep_date to compare event days with non-event days.\\n- labor_schedule is hourly; is_forecast = true rows are next week's plan. Labor % = labor_cost / revenue for the same store and date.\\n- Data runs through 2026-10-01. \\\"Last week\\\" means the 7 days ending on the latest order_date.\\n- Always name stores by stores.name, not only the id.\"]}], \"example_question_sqls\": [{\"id\": \"20000000000000000000000000000001\", \"question\": [\"Dough waste % by store, last 30 days\"], \"sql\": [\"SELECT s.name, ROUND(100.0 * SUM(d.balls_wasted) / SUM(d.balls_mixed), 1) AS waste_pct FROM ${var.catalog}.${var.schema}.dough_prep_log d JOIN ${var.catalog}.${var.schema}.stores s USING (store_id) WHERE d.prep_date > (SELECT MAX(prep_date) FROM ${var.catalog}.${var.schema}.dough_prep_log) - INTERVAL 30 DAYS GROUP BY s.name ORDER BY waste_pct DESC\"]}, {\"id\": \"20000000000000000000000000000002\", \"question\": [\"Dinner rush revenue on event vs non-event days\"], \"sql\": [\"SELECT CASE WHEN e.event_date IS NULL THEN 'no home game' ELSE 'home game' END AS day_type, ROUND(SUM(t.order_total) / COUNT(DISTINCT t.store_id, t.order_date), 2) AS dinner_rev_per_store_day FROM ${var.catalog}.${var.schema}.pos_transactions t LEFT JOIN (SELECT DISTINCT event_date FROM ${var.catalog}.${var.schema}.local_events) e ON e.event_date = t.order_date WHERE t.order_hour BETWEEN 16 AND 19 GROUP BY 1\"]}]}}"
