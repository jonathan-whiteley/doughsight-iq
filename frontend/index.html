<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lc-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DoughSight IQ - Little Caesars Operations Management Platform" />
    <title>DoughSight IQ | Little Caesars</title>
    
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
      /* Light theme CSS variables (same as src/index.css) */
      :root {
        --bg: 255 248 243;
        --surface-default: 255 255 255;
        --text-primary: 26 26 26;
        --text-secondary: 107 114 128;
      }

      /* Dark theme (Halloween) CSS variables */
      html.halloween {
        --bg: 18 13 24;
        --surface-default: 30 23 38;
        --text-primary: 245 239 230;
        --text-secondary: 184 175 196;
      }

      /* Loading state */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: rgb(var(--bg));
        color: rgb(var(--text-primary));
        transition: background-color 0.4s, color 0.4s;
      }

      html.halloween body {
        background: radial-gradient(1200px 600px at 80% -10%, rgba(109, 40, 217, 0.28), transparent 60%), rgb(var(--bg));
      }

      #root {
        min-height: 100vh;
      }

      /* Initial loader */
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 1rem;
      }

      .loader-logo {
        width: 64px;
        height: 64px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.98); }
      }
    </style>

    <!-- Prevent white flash on load -->
    <script>
      (function() {
        const param = new URLSearchParams(location.search).get('theme');
        const theme = param || localStorage.getItem('doughsight-theme');
        if (theme === 'halloween') {
          document.documentElement.classList.add('halloween', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <img class="loader-logo" src="/lc-logo.svg" alt="Little Caesars" />
        <span style="color: #6B7280; font-size: 14px;">Loading DoughSight IQ...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
